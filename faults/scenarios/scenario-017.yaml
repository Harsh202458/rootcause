id: scenario-017
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: 5xx error rate above 5% on inventory
inject:
  - action: pause_container
    target: redis
revert:
  - action: unpause_container
    target: redis
warmup_seconds: 240
deploys:
  - service: inventory
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: product list cache TTL 30s -> 45s"
    diff_summary: "PRODUCT_LIST_TTL: 30 -> 45"
    minutes_before: 33
ground_truth:
  component: redis
  category: redis_unavailable
  evidence:
    - redis container is paused
    - redis commands time out in inventory
