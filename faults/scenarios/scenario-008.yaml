id: scenario-008
alert:
  name: HighMemoryUsage
  labels:
    service: orders
    severity: warning
  description: Container memory usage above 85%
inject:
  - action: inject_code_fault
    target: orders
    params:
      file: src/index.ts
      fault: global.leak = global.leak || []; global.leak.push(new
        Array(1000000).fill("B"));
  - action: restart_service_with_version
    target: orders
    params:
      version: 1.4.1
revert:
  - action: revert_code_fault
    target: orders
    params:
      file: src/index.ts
  - action: restart_service_with_version
    target: orders
    params:
      version: 1.4.0
warmup_seconds: 180
ground_truth:
  component: orders
  category: memory_leak
  evidence:
    - OOM restarts
    - Rising memory metrics
decoy_deploys:
  - service: orders
    kind: config_update
    from_version: 1.4.0
    to_version: 1.4.1
    summary: "chore: update base image"
    minutes_before: 5
