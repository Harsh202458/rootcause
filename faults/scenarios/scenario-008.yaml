id: scenario-008
alert:
  name: HighMemory
  labels:
    service: orders
    severity: warning
  description: Memory above 150MB on orders
inject:
  - action: deploy
    target: orders
    params:
      version: 1.4.2
revert:
  - action: deploy
    target: orders
warmup_seconds: 240
deploys:
  - service: orders
    kind: code
    from_version: 1.4.0
    to_version: 1.4.2
    summary: "feat: order audit trail"
    diff_summary: "orders/middleware: record request audit entries"
    minutes_before: 0
  - service: inventory
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: product list cache TTL 30s -> 45s"
    diff_summary: "PRODUCT_LIST_TTL: 30 -> 45"
    minutes_before: 3
ground_truth:
  component: orders
  category: memory_leak
  evidence:
    - orders memory climbs steadily
    - orders restarts after being killed for memory
