id: scenario-019
alert:
  name: HighErrorRate
  labels:
    service: orders
    severity: critical
  description: 5xx error rate above 5% on orders
inject:
  - action: deploy
    target: orders
    params:
      version: 1.4.4
revert:
  - action: deploy
    target: orders
warmup_seconds: 240
deploys:
  - service: orders
    kind: code
    from_version: 1.4.0
    to_version: 1.4.4
    summary: "refactor: wrap order insert in a transaction"
    diff_summary: "orders/routes: POST /orders uses an explicit transaction"
    minutes_before: 0
  - service: gateway
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: raise upstream timeout 4s -> 5s"
    diff_summary: "UPSTREAM_TIMEOUT_MS: 4000 -> 5000"
    minutes_before: 10
ground_truth:
  component: orders
  category: connection_pool_exhaustion
  evidence:
    - orders pool is fully checked out with requests waiting
    - orders sessions idle in transaction
