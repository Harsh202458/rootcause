id: scenario-027
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: 5xx error rate above 5% on inventory
inject:
  - action: run_sql
    target: postgres
    params:
      query: BEGIN; LOCK TABLE products IN ACCESS EXCLUSIVE MODE;
      hold_open: true
revert:
  - action: release_sessions
    target: postgres
warmup_seconds: 240
deploys:
  - service: gateway
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: raise upstream timeout 4s -> 5s"
    diff_summary: "UPSTREAM_TIMEOUT_MS: 4000 -> 5000"
    minutes_before: 29
ground_truth:
  component: postgres
  category: long_running_lock
  evidence:
    - a batch-worker session holds an exclusive lock on products
    - product queries wait on the lock
