id: scenario-027
alert:
  name: HighP95Latency
  labels:
    service: orders
    severity: warning
  description: p95 latency above 2s on orders
inject:
  - action: run_sql
    target: postgres
    params:
      query: SELECT pg_advisory_lock(12345); SELECT pg_sleep(3600);
      async: true
revert:
  - action: cancel_long_queries
    target: postgres
    params: {}
warmup_seconds: 60
ground_truth:
  component: postgres
  category: long_running_lock
  evidence:
    - Advisory lock 12345 held
    - App logic blocked on advisory lock
decoy_deploys: []
