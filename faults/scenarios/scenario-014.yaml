id: scenario-014
alert:
  name: HighErrorRate
  labels:
    service: gateway
    severity: critical
  description: 5xx error rate above 5% on gateway
inject:
  - action: stop_container
    target: orders
revert:
  - action: start_container
    target: orders
warmup_seconds: 240
deploys:
  - service: orders
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: include request id in access log"
    diff_summary: "LOG_REQUEST_ID: false -> true"
    minutes_before: 8
ground_truth:
  component: orders
  category: dependency_down
  evidence:
    - orders container is stopped
    - gateway cannot connect to orders
