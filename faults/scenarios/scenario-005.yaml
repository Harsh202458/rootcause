id: scenario-005
alert:
  name: HighLatency
  labels:
    service: orders
    severity: warning
  description: Slow queries on orders database
inject:
  - action: run_sql
    target: postgres
    params:
      query: DROP INDEX IF EXISTS idx_orders_created_at;
revert:
  - action: run_sql
    target: postgres
    params:
      query: CREATE INDEX idx_orders_created_at ON orders(created_at);
warmup_seconds: 120
ground_truth:
  component: postgres
  category: dropped_index
  evidence:
    - Index idx_orders_created_at missing
    - High query latency on date range queries
decoy_deploys: []
