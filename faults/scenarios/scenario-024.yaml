id: scenario-024
alert:
  name: HighP95Latency
  labels:
    service: inventory
    severity: warning
  description: p95 latency above threshold on inventory
inject:
  - action: deploy
    target: inventory
    params:
      version: 1.4.3
revert:
  - action: deploy
    target: inventory
warmup_seconds: 240
deploys:
  - service: inventory
    kind: code
    from_version: 1.4.0
    to_version: 1.4.3
    summary: "feat: locale-aware price formatting"
    diff_summary: "inventory/routes: format price on GET /products/:id"
    minutes_before: 0
  - service: postgres
    kind: migration
    summary: "migration: document orders.payment_id"
    diff_summary: COMMENT ON COLUMN orders.payment_id IS 'card processor reference'
    minutes_before: 21
ground_truth:
  component: inventory
  category: slow_dependency
  evidence:
    - inventory event loop lag is high
    - GET /products/:id is slow, queries are not
