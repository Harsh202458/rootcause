id: scenario-002
alert:
  name: HighErrorRate
  labels:
    service: orders
    severity: critical
  description: 5xx error rate above 5% on orders
inject:
  - action: deploy
    target: orders
    params:
      version: 1.4.1
revert:
  - action: deploy
    target: orders
warmup_seconds: 240
deploys:
  - service: orders
    kind: code
    from_version: 1.4.0
    to_version: 1.4.1
    summary: "feat: regional pricing rules"
    diff_summary: "orders/routes: multiply total by REGION_RULES[region]"
    minutes_before: 0
  - service: payments
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: rotate card processor credentials"
    diff_summary: "PROCESSOR_API_KEY: (rotated)"
    minutes_before: 1
  - service: gateway
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: raise upstream timeout 4s -> 5s"
    diff_summary: "UPSTREAM_TIMEOUT_MS: 4000 -> 5000"
    minutes_before: 31
ground_truth:
  component: orders
  category: bad_code_deploy
  evidence:
    - orders 1.4.1 deployed when errors began
    - TypeError in POST /orders
