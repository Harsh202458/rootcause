id: scenario-022
alert:
  name: HighP95Latency
  labels:
    service: gateway
    severity: warning
  description: p95 latency above 2s on gateway
inject:
  - action: exec_in_container
    target: payments
    params:
      cmd: tc qdisc add dev eth0 root netem delay 10000ms
revert:
  - action: exec_in_container
    target: payments
    params:
      cmd: tc qdisc del dev eth0 root
warmup_seconds: 60
ground_truth:
  component: payments
  category: slow_dependency
  evidence:
    - payments network delayed 10s
    - gateway timeouts to payments
decoy_deploys: []
