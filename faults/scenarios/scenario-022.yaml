id: scenario-022
alert:
  name: HighP95Latency
  labels:
    service: payments
    severity: warning
  description: p95 latency above threshold on payments
inject:
  - action: http_post
    target: payments
    params:
      port: 3003
      path: /internal/processor
      body:
        latencyMs: 1500
revert:
  - action: http_post
    target: payments
    params:
      port: 3003
      path: /internal/processor
      body:
        latencyMs: 0
warmup_seconds: 240
deploys:
  - service: gateway
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: raise upstream timeout 4s -> 5s"
    diff_summary: "UPSTREAM_TIMEOUT_MS: 4000 -> 5000"
    minutes_before: 12
ground_truth:
  component: payments
  category: slow_dependency
  evidence:
    - POST /payments takes about 1.5s
    - checkout latency follows payments
