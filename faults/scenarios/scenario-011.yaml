id: scenario-011
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: 5xx error rate above 5% on inventory
inject:
  - action: deploy
    target: inventory
    params:
      env:
        POSTGRES_HOST: postgres-replica
revert:
  - action: deploy
    target: inventory
warmup_seconds: 240
deploys:
  - service: inventory
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: read products from the replica"
    diff_summary: "POSTGRES_HOST: postgres -> postgres-replica"
    minutes_before: 0
  - service: payments
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: rotate card processor credentials"
    diff_summary: "PROCESSOR_API_KEY: (rotated)"
    minutes_before: 4
ground_truth:
  component: inventory
  category: wrong_config
  evidence:
    - inventory cannot resolve postgres-replica
    - postgres itself is healthy
