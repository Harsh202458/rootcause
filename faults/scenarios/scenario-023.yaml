id: scenario-023
alert:
  name: HighP95Latency
  labels:
    service: orders
    severity: warning
  description: p95 latency above threshold on orders
inject:
  - action: deploy
    target: orders
    params:
      version: 1.4.3
revert:
  - action: deploy
    target: orders
warmup_seconds: 240
deploys:
  - service: orders
    kind: code
    from_version: 1.4.0
    to_version: 1.4.3
    summary: "feat: sign order requests"
    diff_summary: "orders/middleware: derive a signing key per request"
    minutes_before: 0
  - service: inventory
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: product list cache TTL 30s -> 45s"
    diff_summary: "PRODUCT_LIST_TTL: 30 -> 45"
    minutes_before: 5
ground_truth:
  component: orders
  category: slow_dependency
  evidence:
    - orders event loop lag is high
    - every orders route is slow, queries are not
