id: scenario-023
alert:
  name: HighP95Latency
  labels:
    service: orders
    severity: warning
  description: p95 latency above 2s on orders
inject:
  - action: inject_code_fault
    target: orders
    params:
      file: src/db.ts
      fault: await new Promise(r => setTimeout(r, 5000));
  - action: restart_service_with_version
    target: orders
    params:
      version: 1.4.1
revert:
  - action: revert_code_fault
    target: orders
    params:
      file: src/db.ts
  - action: restart_service_with_version
    target: orders
    params:
      version: 1.4.0
warmup_seconds: 60
ground_truth:
  component: orders
  category: slow_dependency
  evidence:
    - Code injection adding 5s delay
    - Query execution times > 5s
decoy_deploys: []
