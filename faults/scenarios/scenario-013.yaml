id: scenario-013
alert:
  name: HighErrorRate
  labels:
    service: gateway
    severity: critical
  description: 5xx error rate above 5% on gateway
inject:
  - action: stop_container
    target: payments
revert:
  - action: start_container
    target: payments
warmup_seconds: 240
deploys:
  - service: payments
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: rotate card processor credentials"
    diff_summary: "PROCESSOR_API_KEY: (rotated)"
    minutes_before: 24
ground_truth:
  component: payments
  category: dependency_down
  evidence:
    - payments container is stopped
    - gateway cannot connect to payments
