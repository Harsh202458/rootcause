id: scenario-013
alert:
  name: HighErrorRate
  labels:
    service: gateway
    severity: critical
  description: 5xx error rate above 5% on gateway
inject:
  - action: stop_container
    target: payments
    params: {}
revert:
  - action: start_container
    target: payments
    params: {}
warmup_seconds: 60
ground_truth:
  component: payments
  category: dependency_down
  evidence:
    - payments container stopped
    - Gateway connection refused to payments
decoy_deploys: []
