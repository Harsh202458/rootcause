id: scenario-020
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: 5xx error rate above 5% on inventory
inject:
  - action: deploy
    target: inventory
    params:
      version: 1.4.4
revert:
  - action: deploy
    target: inventory
warmup_seconds: 240
deploys:
  - service: inventory
    kind: code
    from_version: 1.4.0
    to_version: 1.4.4
    summary: "refactor: reserve stock inside a transaction"
    diff_summary: "inventory/routes: reserve uses an explicit transaction"
    minutes_before: 0
  - service: orders
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: include request id in access log"
    diff_summary: "LOG_REQUEST_ID: false -> true"
    minutes_before: 2
ground_truth:
  component: inventory
  category: connection_pool_exhaustion
  evidence:
    - inventory pool is fully checked out with requests waiting
    - inventory sessions idle in transaction
