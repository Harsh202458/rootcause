id: scenario-020
alert:
  name: HighP95Latency
  labels:
    service: inventory
    severity: warning
  description: p95 latency above 2s on inventory
inject:
  - action: restart_service_with_env
    target: inventory
    params:
      env:
        DB_POOL_MAX: "1"
revert:
  - action: restart_service_with_env
    target: inventory
    params:
      env:
        DB_POOL_MAX: "20"
warmup_seconds: 60
ground_truth:
  component: inventory
  category: connection_pool_exhaustion
  evidence:
    - DB_POOL_MAX is 1
    - timeout acquiring client from pool
decoy_deploys: []
