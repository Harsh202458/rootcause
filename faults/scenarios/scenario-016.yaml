id: scenario-016
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: 5xx error rate above 5% on inventory
inject:
  - action: stop_container
    target: redis
revert:
  - action: start_container
    target: redis
warmup_seconds: 240
deploys:
  - service: inventory
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: product list cache TTL 30s -> 45s"
    diff_summary: "PRODUCT_LIST_TTL: 30 -> 45"
    minutes_before: 7
ground_truth:
  component: redis
  category: redis_unavailable
  evidence:
    - redis container is stopped
    - inventory cannot take reservation locks
