id: scenario-016
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: 5xx error rate above 5% on inventory
inject:
  - action: stop_container
    target: redis
    params: {}
revert:
  - action: start_container
    target: redis
    params: {}
warmup_seconds: 60
ground_truth:
  component: redis
  category: redis_unavailable
  evidence:
    - redis container stopped
    - Cache misses 100%
decoy_deploys: []
