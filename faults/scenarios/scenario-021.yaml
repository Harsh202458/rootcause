id: scenario-021
alert:
  name: HighErrorRate
  labels:
    service: orders
    severity: critical
  description: 5xx error rate above 5% on orders
inject:
  - action: deploy
    target: orders
    params:
      version: 1.4.5
revert:
  - action: deploy
    target: orders
warmup_seconds: 240
deploys:
  - service: orders
    kind: code
    from_version: 1.4.0
    to_version: 1.4.5
    summary: "perf: reuse a pooled connection for order lookup"
    diff_summary: "orders/routes: GET /orders/:id checks out a client"
    minutes_before: 0
  - service: payments
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: rotate card processor credentials"
    diff_summary: "PROCESSOR_API_KEY: (rotated)"
    minutes_before: 19
ground_truth:
  component: orders
  category: connection_pool_exhaustion
  evidence:
    - orders pool is fully checked out with requests waiting
    - timeouts acquiring a connection
