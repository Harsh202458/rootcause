id: scenario-021
alert:
  name: DBPoolExhausted
  labels:
    service: orders
    severity: critical
  description: Orders service failing to get DB connections
inject:
  - action: restart_service_with_env
    target: orders
    params:
      env:
        DB_POOL_MAX: "1"
  - action: run_sql
    target: postgres
    params:
      query: SELECT pg_sleep(300);
      async: true
revert:
  - action: restart_service_with_env
    target: orders
    params:
      env:
        DB_POOL_MAX: "20"
  - action: cancel_long_queries
    target: postgres
    params: {}
warmup_seconds: 60
ground_truth:
  component: orders
  category: connection_pool_exhaustion
  evidence:
    - DB_POOL_MAX is 1
    - long running query hogging connection
decoy_deploys: []
