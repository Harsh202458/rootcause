id: scenario-015
alert:
  name: HighErrorRate
  labels:
    service: gateway
    severity: critical
  description: 5xx error rate above 5% on gateway
inject:
  - action: stop_container
    target: inventory
revert:
  - action: start_container
    target: inventory
warmup_seconds: 240
deploys:
  - service: gateway
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: raise upstream timeout 4s -> 5s"
    diff_summary: "UPSTREAM_TIMEOUT_MS: 4000 -> 5000"
    minutes_before: 5
ground_truth:
  component: inventory
  category: dependency_down
  evidence:
    - inventory container is stopped
    - gateway cannot connect to inventory
