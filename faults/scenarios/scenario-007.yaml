id: scenario-007
alert:
  name: HighMemory
  labels:
    service: gateway
    severity: warning
  description: Memory above 150MB on gateway
inject:
  - action: deploy
    target: gateway
    params:
      version: 1.4.2
revert:
  - action: deploy
    target: gateway
warmup_seconds: 240
deploys:
  - service: gateway
    kind: code
    from_version: 1.4.0
    to_version: 1.4.2
    summary: "feat: keep response samples for audit"
    diff_summary: "gateway/middleware: sample responses"
    minutes_before: 0
  - service: orders
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: include request id in access log"
    diff_summary: "LOG_REQUEST_ID: false -> true"
    minutes_before: 18
ground_truth:
  component: gateway
  category: memory_leak
  evidence:
    - gateway memory climbs steadily
    - gateway restarts after being killed for memory
