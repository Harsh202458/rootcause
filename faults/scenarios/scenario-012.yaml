id: scenario-012
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: 5xx error rate above 5% on inventory
inject:
  - action: deploy
    target: inventory
    params:
      env:
        REDIS_HOST: redis-cache
revert:
  - action: deploy
    target: inventory
warmup_seconds: 240
deploys:
  - service: inventory
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: move cache to the dedicated redis"
    diff_summary: "REDIS_HOST: redis -> redis-cache"
    minutes_before: 0
  - service: orders
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: include request id in access log"
    diff_summary: "LOG_REQUEST_ID: false -> true"
    minutes_before: 27
ground_truth:
  component: inventory
  category: wrong_config
  evidence:
    - inventory cannot resolve redis-cache
    - redis itself is healthy
