id: scenario-006
alert:
  name: HighLatency
  labels:
    service: orders
    severity: warning
  description: Slow queries on orders database
inject:
  - action: run_sql
    target: postgres
    params:
      query: DROP INDEX IF EXISTS idx_orders_status;
revert:
  - action: run_sql
    target: postgres
    params:
      query: CREATE INDEX idx_orders_status ON orders(status);
warmup_seconds: 120
ground_truth:
  component: postgres
  category: dropped_index
  evidence:
    - Index idx_orders_status missing
    - High query latency on status queries
decoy_deploys: []
