id: scenario-006
alert:
  name: HighP95Latency
  labels:
    service: orders
    severity: warning
  description: p95 latency above threshold on orders
inject:
  - action: run_sql
    target: postgres
    params:
      query: DROP INDEX IF EXISTS idx_orders_status
revert:
  - action: run_sql
    target: postgres
    params:
      query: CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status)
warmup_seconds: 240
deploys:
  - service: postgres
    kind: migration
    summary: "migration: clean up indexes on orders"
    diff_summary: DROP INDEX idx_orders_status
    minutes_before: 0
  - service: payments
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: rotate card processor credentials"
    diff_summary: "PROCESSOR_API_KEY: (rotated)"
    minutes_before: 9
ground_truth:
  component: postgres
  category: dropped_index
  evidence:
    - idx_orders_status is missing
    - GET /orders/pending-count is slow
