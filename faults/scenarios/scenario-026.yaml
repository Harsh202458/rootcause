id: scenario-026
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: 5xx error rate above 5% on inventory
inject:
  - action: run_sql
    target: postgres
    params:
      query: BEGIN; SELECT id FROM products FOR UPDATE;
      hold_open: true
revert:
  - action: release_sessions
    target: postgres
warmup_seconds: 240
deploys:
  - service: inventory
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: product list cache TTL 30s -> 45s"
    diff_summary: "PRODUCT_LIST_TTL: 30 -> 45"
    minutes_before: 1
ground_truth:
  component: postgres
  category: long_running_lock
  evidence:
    - a batch-worker session holds row locks on products
    - stock updates wait on the lock
