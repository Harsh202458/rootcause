id: scenario-001
alert:
  name: HighErrorRate
  labels:
    service: gateway
    severity: critical
  description: 5xx error rate above 5% on gateway
inject:
  - action: deploy
    target: gateway
    params:
      version: 1.4.1
revert:
  - action: deploy
    target: gateway
warmup_seconds: 240
deploys:
  - service: gateway
    kind: code
    from_version: 1.4.0
    to_version: 1.4.1
    summary: "feat: validate coupon codes at checkout"
    diff_summary: "gateway/checkout: reject coupon codes longer than 12 characters"
    minutes_before: 0
  - service: inventory
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: product list cache TTL 30s -> 45s"
    diff_summary: "PRODUCT_LIST_TTL: 30 -> 45"
    minutes_before: 14
ground_truth:
  component: gateway
  category: bad_code_deploy
  evidence:
    - gateway 1.4.1 deployed when errors began
    - TypeError in POST /checkout
