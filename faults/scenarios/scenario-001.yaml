id: scenario-001
alert:
  name: HighErrorRate
  labels:
    service: gateway
    severity: critical
  description: 5xx error rate above 5% on gateway
inject:
  - action: inject_code_fault
    target: gateway
    params:
      file: src/routes/checkout.ts
      fault: throw new Error("Internal Server Error");
  - action: restart_service_with_version
    target: gateway
    params:
      version: 1.4.1
revert:
  - action: revert_code_fault
    target: gateway
    params:
      file: src/routes/checkout.ts
  - action: restart_service_with_version
    target: gateway
    params:
      version: 1.4.0
warmup_seconds: 60
ground_truth:
  component: gateway
  category: bad_code_deploy
  evidence:
    - Deploy to 1.4.1
    - 500s on /checkout
decoy_deploys:
  - service: gateway
    kind: api_update
    from_version: 1.4.0
    to_version: 1.4.1
    summary: "feat: add payment intent validation"
    minutes_before: 1
