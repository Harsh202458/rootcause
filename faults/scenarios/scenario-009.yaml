id: scenario-009
alert:
  name: HighMemory
  labels:
    service: inventory
    severity: warning
  description: Memory above 150MB on inventory
inject:
  - action: deploy
    target: inventory
    params:
      version: 1.4.2
revert:
  - action: deploy
    target: inventory
warmup_seconds: 240
deploys:
  - service: inventory
    kind: code
    from_version: 1.4.0
    to_version: 1.4.2
    summary: "feat: track recently viewed products"
    diff_summary: "inventory/routes: remember product views"
    minutes_before: 0
  - service: postgres
    kind: migration
    summary: "migration: document orders.payment_id"
    diff_summary: COMMENT ON COLUMN orders.payment_id IS 'card processor reference'
    minutes_before: 11
ground_truth:
  component: inventory
  category: memory_leak
  evidence:
    - inventory memory climbs steadily
    - inventory restarts after being killed for memory
