id: scenario-003
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: Elevated 500 responses on /products/:id
inject:
  - action: inject_code_fault
    target: inventory
    params:
      file: src/routes/products.ts
      fault: throw new TypeError("Cannot read properties of undefined");
  - action: restart_service_with_version
    target: inventory
    params:
      version: 1.4.1
revert:
  - action: revert_code_fault
    target: inventory
    params:
      file: src/routes/products.ts
  - action: restart_service_with_version
    target: inventory
    params:
      version: 1.4.0
warmup_seconds: 60
ground_truth:
  component: inventory
  category: bad_code_deploy
  evidence:
    - Deploy to 1.4.1
    - 500s on /products
decoy_deploys:
  - service: inventory
    kind: api_update
    from_version: 1.4.0
    to_version: 1.4.1
    summary: "perf: optimize caching logic for products"
    minutes_before: 3
