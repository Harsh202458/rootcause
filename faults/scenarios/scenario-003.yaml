id: scenario-003
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: 5xx error rate above 5% on inventory
inject:
  - action: deploy
    target: inventory
    params:
      version: 1.4.1
revert:
  - action: deploy
    target: inventory
warmup_seconds: 240
deploys:
  - service: inventory
    kind: code
    from_version: 1.4.0
    to_version: 1.4.1
    summary: "feat: return variant count with product"
    diff_summary: "inventory/routes: add variantCount to GET /products/:id"
    minutes_before: 0
  - service: gateway
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: raise upstream timeout 4s -> 5s"
    diff_summary: "UPSTREAM_TIMEOUT_MS: 4000 -> 5000"
    minutes_before: 22
ground_truth:
  component: inventory
  category: bad_code_deploy
  evidence:
    - inventory 1.4.1 deployed when errors began
    - TypeError in GET /products/:id
