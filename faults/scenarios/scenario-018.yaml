id: scenario-018
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: 5xx error rate above 5% on inventory
inject:
  - action: disconnect_network
    target: redis
    params: {}
revert:
  - action: connect_network
    target: redis
    params: {}
warmup_seconds: 60
ground_truth:
  component: redis
  category: redis_unavailable
  evidence:
    - redis container off network
    - Connection timeouts to redis
decoy_deploys: []
