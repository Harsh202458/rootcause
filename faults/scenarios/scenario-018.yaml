id: scenario-018
alert:
  name: HighErrorRate
  labels:
    service: inventory
    severity: critical
  description: 5xx error rate above 5% on inventory
inject:
  - action: disconnect_network
    target: redis
revert:
  - action: connect_network
    target: redis
warmup_seconds: 240
deploys:
  - service: postgres
    kind: migration
    summary: "migration: document orders.payment_id"
    diff_summary: COMMENT ON COLUMN orders.payment_id IS 'card processor reference'
    minutes_before: 13
ground_truth:
  component: redis
  category: redis_unavailable
  evidence:
    - redis is running but unreachable
    - inventory cannot reach redis
