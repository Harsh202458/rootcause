id: scenario-025
alert:
  name: HighErrorRate
  labels:
    service: orders
    severity: critical
  description: 5xx error rate above 5% on orders
inject:
  - action: run_sql
    target: postgres
    params:
      query: BEGIN; LOCK TABLE orders IN ACCESS EXCLUSIVE MODE;
      hold_open: true
revert:
  - action: release_sessions
    target: postgres
warmup_seconds: 240
deploys:
  - service: orders
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: include request id in access log"
    diff_summary: "LOG_REQUEST_ID: false -> true"
    minutes_before: 15
ground_truth:
  component: postgres
  category: long_running_lock
  evidence:
    - a batch-worker session holds an exclusive lock on orders
    - orders queries wait on the lock
