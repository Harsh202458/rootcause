id: scenario-010
alert:
  name: HighErrorRate
  labels:
    service: orders
    severity: critical
  description: 5xx error rate above 5% on orders
inject:
  - action: deploy
    target: orders
    params:
      env:
        POSTGRES_HOST: pg-primary
revert:
  - action: deploy
    target: orders
warmup_seconds: 240
deploys:
  - service: orders
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: point orders at the primary database endpoint"
    diff_summary: "POSTGRES_HOST: postgres -> pg-primary"
    minutes_before: 0
  - service: gateway
    kind: config
    from_version: 1.4.0
    to_version: 1.4.0
    summary: "config: raise upstream timeout 4s -> 5s"
    diff_summary: "UPSTREAM_TIMEOUT_MS: 4000 -> 5000"
    minutes_before: 16
ground_truth:
  component: orders
  category: wrong_config
  evidence:
    - orders cannot resolve pg-primary
    - postgres itself is healthy
